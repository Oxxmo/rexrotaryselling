name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, on annule les précédents en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de GitHub Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetage du site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
